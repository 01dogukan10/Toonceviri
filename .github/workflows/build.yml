name: APK derle ve yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü oku
        id: ver
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: İmza anahtarını hazırla
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            # Yapıştırırken araya giren boşluk / satır sonlarını temizle
            printf %s "$SIGNING_KEY" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/toonceviri.jks" \
              || { echo "::error::SIGNING_KEY çözülemedi (base64 bozuk)"; exit 1; }
            PW=$(printf %s "$SIGNING_PASSWORD" | tr -d ' \r\n\t')
            keytool -list -keystore "$RUNNER_TEMP/toonceviri.jks" -storepass "$PW" > /dev/null 2>&1 \
              || { echo "::error::İmza anahtarı açılamadı: SIGNING_PASSWORD yanlış ya da SIGNING_KEY eksik kopyalanmış"; exit 1; }
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/toonceviri.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEY secret yok, geçici imza kullanılıyor (güncelleme olarak kurulmaz)"
          fi

      - name: APK derle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set +e
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Kotlin derleme hataları ("e: ...") önce; yoksa Gradle'ın özeti
            msg=$(grep -m12 "^e: " build.log | sed 's#^e: file://[^ ]*/toonceviri/##' | sed ':a;N;$!ba;s/\n/%0A/g')
            [ -z "$msg" ] && msg=$(grep -A12 "What went wrong" build.log | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::$msg"
          fi
          exit $code

      - name: APK'yı adlandır
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/ToonCeviri-v${{ steps.ver.outputs.version }}.apk"

      # Yeni sürüm numarasıysa Releases kısmına APK + değişiklik notuyla yayınla
      - name: Release oluştur
        # Yalnızca sabit imzalı APK yayınlanır; yoksa güncelleme olarak kurulamaz
        if: steps.ver.outputs.exists == 'false' && env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=${{ steps.ver.outputs.version }}
          gh release create "v$V" "out/ToonCeviri-v$V.apk" \
            --title "ToonÇeviri $V" \
            --notes-file RELEASE_NOTES.md \
            --target "$GITHUB_SHA"
